name: Actualizar dashboard

on:
  schedule:
    # 21:17 UTC todos los días
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance pyarrow pyyaml
      - run: python scripts/generate_dashboard.py
      - run: python scripts/walk_forward.py
      - run: python scripts/generate_mag7w.py
      - run: python scripts/generate_semis.py
      - run: python scripts/generate_msci.py
      - run: python scripts/generate_optimizer.py
      - run: python scripts/sensibilidad.py
      - run: python scripts/rsi30.py --site --out docs/rsi30
      - name: Commit datos del dashboard si hay cambios
        run: |
          git config user.name "Davizz-dev13"
          git config user.email "Davizz-dev13@users.noreply.github.com"
          git add docs/data.json docs/walkforward.json docs/mag7/mag7.json docs/semis/semis.json docs/msci/msci.json docs/rsi30/rsi30.json docs/optimizador/optimizador.json docs/optimizador/optimizador-long.json docs/metodologia/sensibilidad.json
          git diff --cached --quiet && exit 0
          git commit -m "Datos del dashboard: $(date -u +%Y-%m-%d)"
          # ahora hay otro workflow (deudas) que tambien sube commits: rebase antes del push
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
